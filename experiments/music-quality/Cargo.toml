[package]
name = "autostudio-music-quality"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[workspace]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.54", features = ["derive"] }
hex = "0.4.3"
midly = "0.5.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
zeroize = "1.9.0"

[dev-dependencies]
assert_cmd = "2.1.1"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
