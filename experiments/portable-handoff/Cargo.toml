[package]
name = "autostudio-portable-handoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[workspace]

[dependencies]
autostudio-music-quality = { path = "../music-quality" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.54", features = ["derive"] }
hex = "0.4.3"
hound = "3.5.1"
midly = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"

[dev-dependencies]
assert_cmd = "2.1.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
