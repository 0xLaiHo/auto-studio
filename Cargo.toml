[workspace]
members = [
    "crates/autostudio-core",
    "crates/autostudio-provider",
    "crates/autostudio-storage",
    "crates/autostudio-media",
    "crates/autostudio-api",
    "apps/core-daemon",
    "apps/tui",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
crossterm = "0.29.0"
chacha20poly1305 = "0.10.1"
fs2 = "0.4.3"
futures-core = "0.3.31"
futures-util = "0.3.31"
getrandom = "0.3.4"
http-body-util = "0.1.5"
hound = "3.5.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tui-big-text = "0.8.8"
tauri = "2.11.5"
tauri-build = "2.6.3"
uuid = { version = "1.24.1", features = ["serde", "v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
